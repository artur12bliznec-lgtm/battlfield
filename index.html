<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Арсенал Battlfield</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Russo+One&display=swap"
    />
    <link rel="stylesheet" href="./src/viewer/style.css" />
  </head>
  <body>
    <div id="app">
      <aside class="panel">
        <header class="brand">
          <p class="brand-kicker">Battlfield · модели</p>
          <h1 class="brand-title">Арсенал</h1>
        </header>
        <nav id="model-list" class="model-list" aria-label="Модели"></nav>
        <section id="options" class="options" aria-label="Настройки модели"></section>
        <p class="hint">Мышь: вращать · колесо: приблизить · правая кнопка: сдвиг</p>
      </aside>

      <main id="stage" class="stage">
        <canvas id="view" aria-label="3D-модель"></canvas>
        <div class="card card-title">
          <p id="subtitle" class="subtitle"></p>
          <h2 id="title" class="title"></h2>
        </div>
        <dl id="specs" class="card specs"></dl>
        <div class="toolbar" role="toolbar" aria-label="Вид">
          <div class="segmented" id="views">
            <button type="button" id="view-iso" data-view="iso">3/4</button>
            <button type="button" id="view-side" data-view="side">Сбоку</button>
            <button type="button" id="view-front" data-view="front">Спереди</button>
            <button type="button" id="view-top" data-view="top">Сверху</button>
          </div>
          <label class="check"><input type="checkbox" id="opt-rotate" /> Вращение</label>
          <label class="check"><input type="checkbox" id="opt-points" /> Точки крепления</label>
          <label class="check"><input type="checkbox" id="opt-wire" /> Каркас</label>
        </div>
        <button type="button" id="download" class="download">Скачать .glb</button>
      </main>
    </div>
    <script type="module" src="./src/viewer/main.js"></script>
  </body>
</html>
